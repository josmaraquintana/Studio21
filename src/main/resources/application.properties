spring.application.name=Studio21
server.port=8080

# MySQL: createDatabaseIfNotExist=true crea 'studio21db' si no existe. Ajusta usuario y contraseña.
spring.datasource.url=jdbc:mysql://localhost:3306/studio21db?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: crea/actualiza las tablas a partir de las entidades sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera JPA.
spring.jpa.show-sql=true

# Subida de fotografías de productos (MultipartFile).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# Los cambios de HTML y CSS se ven al recargar durante el desarrollo.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# Cloudinary: pon tus credenciales aquí y nunca las subas a un repo público.
cloudinary.cloud_name=
cloudinary.api_key=
cloudinary.api_secret=
