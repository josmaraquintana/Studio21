spring.application.name=Studio21
server.port=8080

# MySQL: createDatabaseIfNotExist=true crea 'studio21db' si no existe. Ajusta usuario y contraseña.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studio21db?serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: crea/actualiza las tablas a partir de las entidades sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera JPA.
spring.jpa.show-sql=true

# Subida de fotografías de productos (MultipartFile).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# Los cambios de HTML y CSS se ven al recargar durante el desarrollo.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# Cloudinary: credenciales mediante variables de entorno; opcional para arrancar.
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# JWT: sin JWT_SECRET se genera una clave temporal al arrancar; vigencia de 24 horas.
jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
