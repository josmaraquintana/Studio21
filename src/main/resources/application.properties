spring.application.name=Studio21
server.port=8080

# Avance de maquetado: conserva JPA y MySQL en Maven, pero no requiere una BD al iniciar.
# Quita esta exclusión cuando configures spring.datasource.url, username y password.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# Los cambios de HTML y CSS se ven al recargar durante el desarrollo.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
